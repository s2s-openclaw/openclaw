name: Build custom image

# Downstream-only workflow kept on the build/custom branch as the reusable
# template for one-off custom runtime images for the s2s fork. Pushes to GHCR as
# :custom. The daily setup uses the official ghcr.io/openclaw/openclaw images;
# this exists only for the occasional patched/experimental build. Not intended
# for openclaw/openclaw.
on:
  push:
    branches: [build/custom]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref (tag/branch/SHA) to build; empty = build this branch tree"
        required: false
        default: ""
      extensions:
        description: "OPENCLAW_EXTENSIONS build-arg"
        required: false
        default: "diagnostics-otel,codex"

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the dispatch-provided ref when given, else this branch tree.
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single amd64 image; the host that runs it is x86_64. Extensions default
      # matches the setup used for :main / :stable so images stay comparable.
      - name: Build and push custom image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            OPENCLAW_EXTENSIONS=${{ github.event.inputs.extensions || 'diagnostics-otel,codex' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:custom
          cache-from: type=gha,scope=build-custom-amd64
          cache-to: type=gha,mode=max,scope=build-custom-amd64
          push: true
